<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Our Week · Family Planner</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#263b33;background:#f6f5f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b5c99b;outline-offset:3px}.shell{max-width:1600px;margin:auto;padding:0 48px}header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedfd6}.brand{font-family:Manrope,sans-serif;font-size:29px;font-weight:800;letter-spacing:-1.5px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px}.brand-icon{font-size:30px;font-weight:400;color:#62795d}.brand-dot{color:#c38b65;margin-left:-10px}.header-note{font-size:12px;color:#7f867d}main{padding:50px 0 24px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:#7a876f}h1{font-family:Manrope,sans-serif;font-size:46px;letter-spacing:-2px;line-height:1.2;margin:13px 0}h1 span{color:#b78b68}.intro p{font-size:14px;color:#7c8379;margin:0}.secondary{border:1px solid #d8dcd1;background:transparent;border-radius:7px;padding:10px 15px;color:#57644f;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;background:#eeefe7;padding:19px 22px;border:1px solid #e1e4d8;border-radius:10px}.week-nav{display:flex;gap:20px;align-items:center}.week-nav>button:not(.today){border:1px solid #d9ded0;background:#f8f8f3;border-radius:6px;width:30px;height:32px;font-size:23px;color:#52654b}.small-label{font-size:9px;letter-spacing:1.6px;font-weight:700;color:#7d8873}h2{font-size:16px;margin:5px 0 0;font-weight:600}.year{font-weight:400;color:#87907f}.today{border:0;border-left:1px solid #d6dccd;padding:7px 0 7px 20px;background:transparent;font-size:11px;color:#75806e}.family-strip{display:flex;align-items:center;gap:22px;padding:24px 2px}.person{font-size:12px;display:flex;align-items:center;gap:7px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}.color0{background:#8a9e76}.color1{background:#c8997e}.color2{background:#819eae}.color3{background:#b19bb8}.color4{background:#d0b665}.hint{margin-left:auto;font-size:11px;color:#93998d}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day{position:relative;background:#fffefa;border:1px solid #e2e4da;border-radius:9px;overflow:hidden;min-width:0}.weekend{background:#f0f1e9}.day-title{display:flex;align-items:center;justify-content:space-between;padding:18px 13px;border-bottom:1px solid #e8eadf;height:61px}.day-title h3{font-size:12px;margin:0;font-weight:600}.date{font-size:17px;color:#8d9784}.is-today{border-color:#8d9f78}.is-today .day-title{background:#e7ecdd}.is-today .date{background:#697f58;color:white;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px;font-size:14px}.today-tag{position:absolute;top:57px;left:13px;background:#6e825e;color:white;border-radius:3px;padding:3px 5px;font-size:7px;letter-spacing:1px}.schedules{padding:24px 12px 0}.schedule{display:block;margin-bottom:15px}.schedule>span{display:flex;gap:6px;align-items:center;font-size:10px;font-weight:600;margin-bottom:5px;overflow-wrap:anywhere}textarea,input{width:100%;border:1px solid transparent;border-radius:4px;color:#43533d;background:transparent;padding:6px 3px;resize:vertical;font-size:11px;line-height:1.6;min-width:0}textarea::placeholder,input::placeholder{color:#a7ac9e}textarea:hover,input:hover{background:#f4f5ee}textarea:focus,input:focus{outline:none;border-color:#a2b18d;background:#fffefb}textarea{display:block;min-height:48px}.rides{border-top:1px dashed #dfe3d5;margin:0 12px;padding:17px 0 8px}.rides label{display:block;margin-bottom:9px}.rides label>span,.dinner>span{font-size:8px;letter-spacing:.9px;font-weight:600;color:#929c86}.dinner{display:block;background:#f3f0e6;padding:15px 12px 12px;border-top:1px solid #e8e5da}.dinner>span{color:#aa9375}.dinner textarea{margin-top:7px;color:#846d51}footer{display:flex;justify-content:space-between;margin-top:25px;font-size:10px;color:#909888}footer span:first-child{color:#788c69}dialog{width:400px;max-width:90vw;border:1px solid #d9dece;border-radius:14px;padding:28px;background:#fffefa;color:#263b33}dialog::backdrop{background:#263b3370}dialog h2{font-size:27px;margin:10px 0}dialog p{font-size:13px;color:#7c8379;line-height:1.6}dialog label{font-size:12px}dialog textarea{border:1px solid #d8dece;margin-top:10px;font-size:14px;padding:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}.primary{background:#627950;color:white;border:0;border-radius:7px;padding:10px 15px;font-size:12px}.form-error{color:#a44237}button:hover{filter:brightness(.95)}@media(min-width:1500px){.day-title h3{font-size:14px}.schedule>span{font-size:12px}textarea,input{font-size:12px}}@media(max-width:1100px){.shell{padding:0 24px}.week-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){header{height:75px}.header-note{display:none}main{padding-top:30px}h1{font-size:34px}.intro{align-items:flex-start;gap:12px}.intro p{font-size:12px;line-height:1.6}.print{white-space:nowrap;font-size:10px}.toolbar{padding:14px 10px;gap:10px}.week-nav{gap:8px}h2{font-size:12px}.year,.today,.hint{display:none}.family-strip{gap:14px;flex-wrap:wrap}.week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.day:last-child{grid-column:1/-1}footer{gap:20px;line-height:1.6}footer span:last-child{text-align:right}.toolbar>.secondary{font-size:10px;padding:9px}}@media print{.shell{padding:0}header{height:60px}main{padding-top:15px}.intro{margin-bottom:20px}h1{font-size:30px}.print,.toolbar button,.hint{display:none}.week-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{break-inside:avoid}.day-title{padding:10px 6px}.day-title h3{font-size:10px}.schedules{padding:20px 6px 0}.rides{margin:0 6px}.dinner{padding:12px 6px}textarea{resize:none}footer{font-size:8px}body{background:white}}
</style></head><body><div id="app"></div><script>
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const key='family-week-planner-v1';
let saved;try{saved=JSON.parse(localStorage.getItem(key));}catch{}
let people=Array.isArray(saved?.people)&&saved.people.length?saved.people:['Alex','Jamie','Sam'];
let weeks=saved?.weeks&&typeof saved.weeks==='object'?saved.weeks:{};
let monday=new Date();monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify({people,weeks}));document.querySelector('#status').textContent='✓ All changes saved on this device';}catch{document.querySelector('#status').textContent='Unable to save. Browser storage may be full or disabled.';}}
function data(){return weeks[iso(monday)]??=(days.map(()=>({schedules:{},pickup:'',dropoff:'',dinner:''})));}
function render(){const week=data();const end=new Date(monday);end.setDate(end.getDate()+6);const fmt={month:'short',day:'numeric'};
document.querySelector('#app').innerHTML=`<div class="shell"><header><a class="brand" href="./"><span class="brand-icon">▦</span> hearth<span class="brand-dot">.</span></a><span class="header-note">A little planning. More time together.</span></header><main><section class="intro"><div><div class="eyebrow">THE FAMILY PLANNER</div><h1>Our week, together<span>.</span></h1><p>Every schedule, every ride, every dinner. One happy place.</p></div><button class="print secondary" id="print">↗ Print week</button></section><section class="toolbar"><div class="week-nav"><button id="prev" aria-label="Previous week">‹</button><div><span class="small-label">WEEK OF</span><h2>${monday.toLocaleDateString('en-US',fmt)} – ${end.toLocaleDateString('en-US',fmt)}<span class="year">, ${end.getFullYear()}</span></h2></div><button id="next" aria-label="Next week">›</button><button class="today" id="today">This week</button></div><button class="secondary" id="members">♧ Edit family</button></section><div class="family-strip"><span class="small-label">OUR CREW</span>${people.map((p,i)=>`<span class="person"><i class="dot color${i%5}"></i>${escape(p)}</span>`).join('')}<span class="hint">Click any field to make it yours</span></div><section class="week-grid">${days.map((day,i)=>{let date=new Date(monday);date.setDate(date.getDate()+i);const today=iso(date)===iso(new Date());return `<article class="day ${i>4?'weekend':''} ${today?'is-today':''}"><div class="day-title"><h3>${day}</h3><span class="date">${date.getDate()}</span></div>${today?'<span class="today-tag">TODAY</span>':''}<div class="schedules">${people.map((p,j)=>`<label class="schedule"><span><i class="dot color${j%5}"></i>${escape(p)}</span><textarea rows="2" data-day="${i}" data-person="${escape(p)}" placeholder="Add a plan…" aria-label="${escape(p)} schedule for ${day}">${escape(week[i].schedules[p])}</textarea></label>`).join('')}</div><div class="rides"><label><span>↗ DROP-OFF</span><input data-day="${i}" data-field="dropoff" value="${escape(week[i].dropoff)}" placeholder="Who's driving?" aria-label="${day} drop-off"></label><label><span>↙ PICKUP</span><input data-day="${i}" data-field="pickup" value="${escape(week[i].pickup)}" placeholder="Who's driving?" aria-label="${day} pickup"></label></div><label class="dinner"><span>♨ ON THE MENU</span><textarea rows="2" data-day="${i}" data-field="dinner" placeholder="What's for dinner?" aria-label="${day} dinner">${escape(week[i].dinner)}</textarea></label></article>`}).join('')}</section><footer><span id="status">✓ Saved automatically on this device</span><span>A plan for the week. Room for the unexpected.</span></footer></main></div><dialog id="family-dialog"><form id="family-form"><div class="eyebrow">YOUR PEOPLE</div><h2>Meet the crew.</h2><p>Enter one name per line. Rename a person to carry their plans along.</p><label for="names">Family members</label><textarea id="names" rows="6" required>${escape(people.join('\n'))}</textarea><p class="form-error" id="family-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="primary">Save family</button></div></form></dialog>`;
document.querySelector('#prev').onclick=()=>move(-7);document.querySelector('#next').onclick=()=>move(7);document.querySelector('#today').onclick=()=>{monday=new Date();monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));render();};document.querySelector('#print').onclick=()=>window.print();
document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('input',()=>{const d=data()[Number(el.dataset.day)];if(el.dataset.person!==undefined)d.schedules[el.dataset.person]=el.value;else d[el.dataset.field]=el.value;save();}));
const dialog=document.querySelector('dialog');document.querySelector('#members').onclick=()=>dialog.showModal();document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#family-form').onsubmit=e=>{e.preventDefault();const names=document.querySelector('#names').value.split('\n').map(n=>n.trim()).filter(Boolean);if(!names.length||new Set(names).size!==names.length){document.querySelector('#family-error').textContent='Add at least one name, and use a different name for each person.';return;}for(const week of Object.values(weeks))for(const day of week){const old=day.schedules;day.schedules=Object.fromEntries(names.map((n,i)=>[n,old[n]??old[people[i]]??'']));}people=names;save();render();};
}
function move(n){monday.setDate(monday.getDate()+n);render();}render();
</script></body></html>
